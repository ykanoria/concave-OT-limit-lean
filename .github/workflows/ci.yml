name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Check publication metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.12"
      - run: ruby scripts/validate-formalization.rb
      - run: ./scripts/verify-vendored-sources.sh
      - name: Validate formalization.yaml v0.4 schema
        run: |
          python3 -m pip install check-jsonschema==0.38.0
          check-jsonschema \
            --schemafile https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/formalization.schema.json \
            formalization.yaml
      - name: Check Palomar statement limits and imports
        run: |
          test "$(wc -l < Challenge.lean)" -le 1000
          test "$(wc -c < Challenge.lean)" -le 102400
          test -z "$(grep '^import ' Challenge.lean | grep -v '^import Mathlib' || true)"
          test -f LICENSE

  build:
    name: Build proof and closure audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true

  comparator:
    name: Compare advertised statements with proofs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.0"
          cache: false
      - run: ./scripts/verify-comparator.sh
